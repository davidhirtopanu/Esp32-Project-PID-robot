[env:freenove_esp32_wrover]
platform = espressif32
board = freenove_esp32_wrover
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^1.4.1
    jrowberg/I2Cdevlib-Core@^1.0.1
